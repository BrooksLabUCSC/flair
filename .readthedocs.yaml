# Read the Docs configuration, version 2
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# python as pyproject.toml requires
build:
  os: ubuntu-22.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py

# the theme is all the build needs: the per-subcommand option pages under
# docs/source/cli are generated by dev/bin/flair-gen-cli-doc and committed, so
# the build does not install FLAIR
python:
  install:
    - requirements: docs/source/requirements.txt
