name: CI

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Determine Target Branch Context
        id: target-branch
        run: |
          # Determine if the target/current branch is 'master' or 'dev'
          TARGET="${{ github.base_ref || github.ref_name }}"
          echo "Target branch context is: $TARGET"
          echo "BRANCH=$TARGET" >> $GITHUB_OUTPUT

      - name: Reject unsupported target branch
        if: steps.target-branch.outputs.BRANCH != 'dev' && steps.target-branch.outputs.BRANCH != 'master'
        run: |
          echo "::error::Unsupported target branch; expected 'dev' or 'master'."
          exit 1

      - name: Setup Conda / Mamba Environment (dev)
        if: steps.target-branch.outputs.BRANCH == 'dev'
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: misc/flair_dev_conda_env.yaml
          environment-name: flair_dev
          cache-environment: true

      - name: Setup Conda / Mamba Environment (master)
        if: steps.target-branch.outputs.BRANCH == 'master'
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: misc/flair_conda_env_ci.yaml
          environment-name: flair_conda_env
          cache-environment: true

      - name: Install local package with dev extras
        if: steps.target-branch.outputs.BRANCH == 'dev'
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Install local package
        if: steps.target-branch.outputs.BRANCH == 'master'
        shell: bash -el {0}
        run: pip install -e .

      # the dev environment has the R packages flair diffexp and flair diffsplice
      # need, so their tests run there; the master environment has not, so its run
      # is the suite without them
      - name: Run tests (dev)
        if: steps.target-branch.outputs.BRANCH == 'dev'
        shell: bash -el {0}
        run: |
          make test

      - name: Run tests (master)
        if: steps.target-branch.outputs.BRANCH == 'master'
        shell: bash -el {0}
        run: |
          make test-base

  # the package as a user installs it: a module or a data file left out of the wheel
  # passes the job above, which installs the source tree, and fails on the first
  # install from PyPI
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Conda / Mamba Environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: misc/flair_dev_conda_env.yaml
          environment-name: flair_dev
          cache-environment: true

      - name: Build the wheel
        shell: bash -el {0}
        run: make build

      - name: Install it in its own environment and run the tests against it
        shell: bash -el {0}
        run: make test-pip
