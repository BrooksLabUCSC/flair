name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

# python as pyproject.toml requires (>=3.12,<3.13), or pip install -e . fails
dependencies:
  - python =3.12
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pysam >=0.23.0,<0.24.0
  # bedToBigBed writes transcriptome's .bb output; intron-prospector is used by
  # flair fusion and the junction tests; make test-base runs both
  - ucsc-bedtobigbed
  - intron-prospector >=1.5
  # variant calling and phasing of the variantquant and isoalleles tests
  - longshot >=1.0
  - whatshap >=2.8
  - pip
  - pip:
      - matplotlib>=3.10.0,<4.0.0
