name: flair_conda_env
channels:
  - conda-forge
  - bioconda
  - conda

# python as pyproject.toml requires.  The --help test expectations are in the
# 3.13 argparse format, which test/Makefile compares only on 3.13 and later
dependencies:
  - python >=3.12,<3.15
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pip
  - pip:
      - flair-brookslab==v3.0.1+master
      - matplotlib>=3.10.0,<4.0.0
