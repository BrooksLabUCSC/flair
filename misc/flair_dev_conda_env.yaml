name: flair-dev

channels:
  - bioconda
  - conda-forge

# bedtools 2.31.1 doesn't work with Python 3.13
dependencies:
  - python =3.12
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pysam >=0.23.0,<0.24.0
  # variant calling and phasing of the variantquant and isoalleles tests
  - longshot >=1.0
  - whatshap >=2.8
  - intron-prospector >=1.5
  - ucsc-bedtobigbed
  - ucsc-hubcheck
  - poetry
  - sphinx
  - sphinx_rtd_theme
  - sphinx-argparse
  - pip
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
