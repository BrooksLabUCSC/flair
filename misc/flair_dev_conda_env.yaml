name: flair-dev

channels:
  - bioconda
  - conda-forge

# python as pyproject.toml requires.  The --help test expectations are in the
# 3.13 argparse format, which test/Makefile compares only on 3.13 and later
dependencies:
  - python >=3.12,<3.15
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  # mappy and ncls publish no linux wheel above python 3.12, so pip builds them
  # from source; mappy needs the zlib headers, which libzlib alone does not carry
  - zlib
  - longshot >=1.0
  - poetry
  - sphinx
  - sphinx_rtd_theme
  - sphinx-argparse
  - pip
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
  - pip:
      - matplotlib>=3.10.0,<4.0.0
