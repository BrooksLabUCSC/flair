name: flair-dev

channels:
  - bioconda
  - conda-forge

# python 3.13 and later needed for the --help test comparisons, which are
# skipped on 3.12: argparse changed its help layout in 3.13
dependencies:
  - python >=3.12,<3.16
  - minimap2 =2.30
  - bedtools =2.31.1
  - samtools =1.22.1
  - pysam >=0.23.0,<0.24.0
  # variant calling and phasing of the variantquant and isoalleles tests
  - longshot >=1.0
  - whatshap >=2.8
  - intron-prospector >=1.5
  - ucsc-bedtobigbed
  - ucsc-hubcheck
  - pipettor >=1.2.1
  - poetry
  - sphinx
  - sphinx_rtd_theme
  - sphinx-argparse
  - pip
  - r-argparse
  - r-ggplot2
  - r-qqman
  - r-lazyeval
  - r-data.table
  - bioconductor-deseq2
  - bioconductor-drimseq
  - bioconductor-stager
  - bioconductor-apeglm
